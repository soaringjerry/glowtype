version: "3.9"

services:
  backend:
    image: ghcr.io/soaringjerry/glowtype-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - backend/.env
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - DB_PATH=/data/glowtype.db
      - SEED_DB=${SEED_DB:-true}
    volumes:
      - glowtype-data:/data
    ports:
      - "${GLOWTYPE_BACKEND_PORT_HOST:-18080}:8080"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  frontend:
    image: ghcr.io/soaringjerry/glowtype-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_SHARE_RENDER_URL=${VITE_SHARE_RENDER_URL:-http://localhost:${GLOWTYPE_RENDER_PORT_HOST:-19080}}
    environment:
      # OpenAI-compatible API configuration (runtime injection)
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_API_URL=${AI_API_URL:-https://api.openai.com/v1}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
    depends_on:
      - backend
      - share-renderer
    ports:
      - "${GLOWTYPE_FRONTEND_PORT_HOST:-18081}:80"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  share-renderer:
    build:
      context: ./scripts/share-renderer
    environment:
      - PORT=4000
      - FRONTEND_RENDER_URL=http://frontend
    ports:
      - "${GLOWTYPE_RENDER_PORT_HOST:-19080}:4000"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - "--label-enable"
      - "--interval=300"
      - "--cleanup"

volumes:
  glowtype-data:
